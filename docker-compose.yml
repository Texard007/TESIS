# ============================================================
# Docker Compose – Plataforma de Adopción de Mascotas
# Servicios: PostgreSQL, API (Node.js), Frontend (Nginx), Reverse Proxy
# ============================================================

services:
  # --------------------------------------------------------
  # Base de datos PostgreSQL
  # --------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: adopcion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # API Backend (Node.js + Express)
  # --------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adopcion-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: /app/uploads
    volumes:
      - api-uploads:/app/uploads
    networks:
      - app-network
    expose:
      - "4000"

  # --------------------------------------------------------
  # Frontend Web (Expo build servido con Nginx)
  # --------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: /api
    container_name: adopcion-web
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "80"

  # --------------------------------------------------------
  # Nginx Reverse Proxy
  # --------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: adopcion-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - app-network

# ============================================================
# Redes
# ============================================================
networks:
  app-network:
    driver: bridge

# ============================================================
# Volúmenes persistentes
# ============================================================
volumes:
  pgdata:
    driver: local
  api-uploads:
    driver: local
  certbot-webroot:
    driver: local
