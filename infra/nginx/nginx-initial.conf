# ============================================================
# Nginx – Configuración HTTP-only para generación de certificados
# Usar esta config ANTES de obtener el certificado SSL
# ============================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    # Tamaño máximo de body
    client_max_body_size 10M;

    # --------------------------------------------------------
    # Upstreams
    # --------------------------------------------------------
    upstream backend_api {
        server api:4000;
    }

    upstream frontend_web {
        server web:80;
    }

    # --------------------------------------------------------
    # Servidor HTTP (puerto 80)
    # --------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com www.yourdomain.com;

        # Certbot ACME challenge – ESENCIAL para obtener el certificado
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Proxy al Backend API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Archivos subidos
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend Web (SPA)
        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
